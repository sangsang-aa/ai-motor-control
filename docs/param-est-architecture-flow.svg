<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010"
     font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="aMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
    <marker id="aCmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#febc2e"/>
    </marker>
    <marker id="aData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="aLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="aDanger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5f57"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1010" fill="#0a0a0a"/>

  <!-- ===== Title ===== -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#ececec">MCB PMSM 参数辨识上位机 — 流程与数据流</text>
  <text x="40" y="80" font-size="14" fill="#9a9a9a">param_est_web（独立工程 · 通讯独立 · 协议采用本样例 MCB host-target · 采集完成后才辨识）</text>

  <!-- ===== Scope note ===== -->
  <rect x="40" y="100" width="1420" height="92" rx="10" fill="#0f0f0f" stroke="rgba(255,255,255,0.10)"/>
  <rect x="40" y="100" width="6" height="92" rx="3" fill="#febc2e"/>
  <text x="64" y="122" font-size="12.5" fill="#febc2e" font-weight="700">独立通道</text>
  <text x="146" y="122" font-size="12.5" fill="#ececec">自带 lib/serial/mcbHostProtocol.ts + paramEstController.ts，不 import 现有 modbus 层，不改 ai_motor_control 任何文件。</text>
  <text x="64" y="144" font-size="12.5" fill="#ececec">目标板 F280025C（固件由 TI SDK 生成、已烧写固定，上位机不烧写）；上位机负责：发命令 + 采集 + 判可用性 + 辨识。</text>
  <text x="64" y="164" font-size="12.5" fill="#ececec">协议采用本样例（MCB host-target）：命令 8 字节（小端）；数据 600 帧 SSSS…EEEE，每帧 2×float32（小端）。</text>
  <text x="64" y="184" font-size="12.5" fill="#febc2e">关键约束：采集与辨识不同时进行 —— 先收完（空闲超时）→ 判数据可用性 → 再辨识。</text>

  <!-- ===== Device band ===== -->
  <rect x="760" y="216" width="660" height="140" rx="10" fill="#0f0f0f" stroke="rgba(255,255,255,0.10)"/>
  <rect x="760" y="216" width="6" height="140" rx="3" fill="#3fb950"/>
  <text x="784" y="246" font-size="14" font-weight="700" fill="#3fb950">下位机 · F280025C（TI SDK 固件，已固定）</text>
  <text x="784" y="274" font-size="12.5" fill="#ececec">· 接收 8 字节命令（配置参数 1..21 / 控制字 22）</text>
  <text x="784" y="298" font-size="12.5" fill="#ececec">· 持续发送原始测量：600 帧 / 7200 字节</text>
  <text x="784" y="320" font-size="12.5" fill="#9a9a9a">帧0 头 = 『SSSS』 · 帧599 尾 = 『EEEE』 · 每帧 2×float32</text>

  <!-- ===== Left flow ===== -->
  <!-- N1 -->
  <rect x="80" y="216" width="620" height="52" rx="9" fill="#141414" stroke="rgba(255,255,255,0.14)"/>
  <rect x="80" y="216" width="5" height="52" rx="2.5" fill="#58a6ff"/>
  <text x="100" y="248" font-size="13" fill="#ececec">① 连接：requestPort()（点击手势内）→ open（独立 SCI 通道，波特率按上位机）</text>

  <!-- N2 -->
  <rect x="80" y="288" width="620" height="52" rx="9" fill="#141414" stroke="rgba(255,255,255,0.14)"/>
  <rect x="80" y="288" width="5" height="52" rx="2.5" fill="#58a6ff"/>
  <text x="100" y="320" font-size="13" fill="#ececec">② 发命令：配置 / 启动（encodeParam 1..21 · encodeControl 22）</text>

  <!-- N3 -->
  <rect x="80" y="360" width="620" height="66" rx="9" fill="#141414" stroke="rgba(255,255,255,0.14)"/>
  <rect x="80" y="360" width="5" height="66" rx="2.5" fill="#58a6ff"/>
  <text x="100" y="386" font-size="13" fill="#ececec">③ 持续采集：SCI 接收原始测量 → 全部缓存</text>
  <text x="100" y="409" font-size="12" fill="#9a9a9a">（此阶段只收，不做任何辨识）</text>

  <!-- D1 -->
  <polygon points="98,452 682,452 700,484 682,516 98,516 80,484" fill="#141414" stroke="#febc2e" stroke-width="1.6"/>
  <text x="390" y="481" font-size="13" fill="#ececec" text-anchor="middle">④ 空闲超时？（无数据 ≥ T）</text>
  <text x="390" y="501" font-size="11" fill="#9a9a9a" text-anchor="middle">判定下位机已停止发送 → 采集完成</text>

  <!-- D2 -->
  <polygon points="98,544 682,544 700,580 682,616 98,616 80,580" fill="#141414" stroke="#febc2e" stroke-width="1.6"/>
  <text x="390" y="573" font-size="13" fill="#ececec" text-anchor="middle">⑤ 数据可用？</text>
  <text x="390" y="593" font-size="11" fill="#9a9a9a" text-anchor="middle">（完整性 + 有效性）</text>

  <!-- N4 -->
  <rect x="80" y="644" width="620" height="66" rx="9" fill="#141414" stroke="rgba(255,255,255,0.14)"/>
  <rect x="80" y="644" width="5" height="66" rx="2.5" fill="#58a6ff"/>
  <text x="100" y="670" font-size="13" fill="#ececec">⑥ 用样例算法辨识</text>
  <text x="100" y="693" font-size="12" fill="#9a9a9a">→ Rs / Ld / Lq / Ke / J / B</text>

  <!-- N5 -->
  <rect x="80" y="736" width="620" height="52" rx="9" fill="#141414" stroke="rgba(255,255,255,0.14)"/>
  <rect x="80" y="736" width="5" height="52" rx="2.5" fill="#58a6ff"/>
  <text x="100" y="768" font-size="13" fill="#ececec">⑦ 显示结果</text>

  <!-- E1 error -->
  <rect x="760" y="544" width="660" height="72" rx="10" fill="#141414" stroke="#ff5f57" stroke-width="1.4"/>
  <rect x="760" y="544" width="6" height="72" rx="3" fill="#ff5f57"/>
  <text x="784" y="574" font-size="13.5" fill="#ff5f57" font-weight="700">抛弃本次数据</text>
  <text x="784" y="598" font-size="13" fill="#ececec">页面显示：「出现数据错误」</text>

  <!-- ===== Arrows: main chain ===== -->
  <line x1="390" y1="268" x2="390" y2="284" stroke="#9a9a9a" stroke-width="2" marker-end="url(#aMuted)"/>
  <line x1="390" y1="340" x2="390" y2="356" stroke="#9a9a9a" stroke-width="2" marker-end="url(#aMuted)"/>
  <line x1="390" y1="426" x2="390" y2="448" stroke="#9a9a9a" stroke-width="2" marker-end="url(#aMuted)"/>

  <!-- D1 是 -> D2 -->
  <line x1="390" y1="516" x2="390" y2="540" stroke="#9a9a9a" stroke-width="2" marker-end="url(#aMuted)"/>
  <text x="396" y="534" font-size="11" fill="#9a9a9a">是</text>

  <!-- D2 是 -> N4 -->
  <line x1="390" y1="616" x2="390" y2="640" stroke="#9a9a9a" stroke-width="2" marker-end="url(#aMuted)"/>
  <text x="396" y="634" font-size="11" fill="#9a9a9a">是</text>

  <!-- N4 -> N5 -->
  <line x1="390" y1="710" x2="390" y2="732" stroke="#9a9a9a" stroke-width="2" marker-end="url(#aMuted)"/>

  <!-- D1 否 -> loop back to N3 -->
  <polyline points="80,484 48,484 48,393 76,393" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aLoop)"/>
  <text x="54" y="470" font-size="11" fill="#58a6ff">否</text>

  <!-- D2 否 -> E1 -->
  <line x1="700" y1="580" x2="752" y2="580" stroke="#ff5f57" stroke-width="2.2" marker-end="url(#aDanger)"/>
  <text x="712" y="572" font-size="11" fill="#ff5f57">否</text>

  <!-- N2 -> device : command -->
  <line x1="700" y1="314" x2="752" y2="314" stroke="#febc2e" stroke-width="2.2" marker-end="url(#aCmd)"/>
  <text x="702" y="306" font-size="10.5" fill="#febc2e">命令 8B</text>

  <!-- device -> N3 : raw data -->
  <polyline points="756,346 728,346 728,393 704,393" fill="none" stroke="#3fb950" stroke-width="2.2" marker-end="url(#aData)"/>
  <text x="704" y="372" font-size="10.5" fill="#3fb950">原始测量</text>

  <!-- ===== Highlight note ===== -->
  <rect x="40" y="812" width="1420" height="46" rx="10" fill="#0f0f0f" stroke="rgba(254,188,46,0.3)"/>
  <rect x="40" y="812" width="6" height="46" rx="3" fill="#febc2e"/>
  <text x="64" y="840" font-size="13" fill="#febc2e" font-weight="700">时序要点</text>
  <text x="146" y="840" font-size="13" fill="#ececec">采集与辨识不同时进行：持续采集(③) → 空闲超时判定停止(④) → 数据可用性判定(⑤) → 辨识(⑥) → 显示(⑦)。</text>

  <!-- ===== Legend / notes ===== -->
  <text x="40" y="892" font-size="13" font-weight="700" fill="#9a9a9a">图例</text>
  <rect x="100" y="882" width="22" height="6" rx="3" fill="#58a6ff"/>
  <text x="130" y="892" font-size="12.5" fill="#9a9a9a">上位机</text>
  <rect x="200" y="882" width="22" height="6" rx="3" fill="#3fb950"/>
  <text x="230" y="892" font-size="12.5" fill="#9a9a9a">下位机 / 上行数据</text>
  <rect x="370" y="882" width="22" height="6" rx="3" fill="#febc2e"/>
  <text x="400" y="892" font-size="12.5" fill="#9a9a9a">下行命令 / 判定</text>
  <rect x="520" y="882" width="22" height="6" rx="3" fill="#ff5f57"/>
  <text x="550" y="892" font-size="12.5" fill="#9a9a9a">数据错误 / 抛弃</text>

  <text x="40" y="930" font-size="12.5" fill="#6a6a6a">注 1：完整性 = 帧结构完整（SSSS…EEEE 对齐、无丢帧/半包、无 NaN/Inf、长度符合预期）；有效性 = 数值有意义（电流/电压在量程内且非零，非全零/饱和空数据）。</text>
  <text x="40" y="954" font-size="12.5" fill="#6a6a6a">注 2：数据不可用 → 直接抛弃，不进入辨识，页面提示「出现数据错误」。波特率由上位机设定、下位机跟随；本图只表达逻辑与数据流。</text>
</svg>
